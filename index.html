<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股每日盤後籌碼戰情室</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0e1626;
      --panel-2: #131e33;
      --border: rgba(148, 163, 184, 0.16);
      --text: #e5edf7;
      --muted: #8fa1bc;
      --red: #ff4d67;
      --red-bg: rgba(255, 77, 103, 0.14);
      --green: #16c784;
      --green-bg: rgba(22, 199, 132, 0.14);
      --gray: #64748b;
      --gray-bg: rgba(100, 116, 139, 0.16);
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: radial-gradient(circle at top, #0f1b33 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    .container {
      max-width: 1520px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      display: inline-block;
    }

    h1 {
      margin: 2px 0 0;
      font-size: 20px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    select, button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover, select:hover {
      border-color: var(--accent);
    }

    .legend {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .tag {
      font-size: 10px;
      color: var(--muted);
      background: var(--panel-2);
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .signal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sig-red { background: var(--red); box-shadow: 0 0 8px rgba(255, 77, 103, 0.5); }
    .sig-green { background: var(--green); box-shadow: 0 0 8px rgba(22, 199, 132, 0.45); }
    .sig-gray { background: var(--gray); }

    .metric-name {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .val-red { color: var(--red); }
    .val-green { color: var(--green); }
    .val-neutral { color: var(--text); }

    .metric-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .table-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .table-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .table-title {
      font-size: 14px;
      font-weight: 700;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      white-space: nowrap;
    }

    th, td {
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    th:first-child, td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: var(--panel);
      z-index: 1;
    }

    th:last-child, td:last-child {
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      background: var(--panel-2);
    }

    tr:hover td {
      background: rgba(56, 189, 248, 0.05);
    }

    .trend-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      font-weight: 600;
      font-size: 11px;
    }

    .op-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .op-bull { background: var(--red-bg); color: var(--red); }
    .op-bear { background: var(--green-bg); color: var(--green); }
    .op-wait { background: var(--gray-bg); color: #cbd5e1; }

    .empty-state {
      text-align: center;
      padding: 22px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <div class="eyebrow">
          <span class="dot-live"></span>
          TWSE / TAIFEX DAILY CHIP ANALYTICS
        </div>
        <h1>台股每日盤後籌碼戰情室</h1>
      </div>

      <div class="controls">
        <div class="pill-box">
          <span>歷史紀錄：</span>
          <select id="dateSelect">
            <option value="__LATEST__">最新盤後數據</option>
          </select>
        </div>
        <div class="pill-box">
          <span>更新時間：</span>
          <strong id="updateTime">讀取中...</strong>
        </div>
        <button id="refreshBtn" type="button" title="重新載入">↻</button>
      </div>
    </div>

    <div class="legend">
      <div class="legend-items">
        <span><i class="badge-dot" style="background:var(--red)"></i>紅燈（偏多訊號）</span>
        <span><i class="badge-dot" style="background:var(--green)"></i>綠燈（偏空訊號）</span>
        <span><i class="badge-dot" style="background:var(--gray)"></i>灰燈（中性參考）</span>
      </div>
      <div>依歷史紅綠燈比例統計隔日台指漲跌作為操作參考</div>
    </div>

    <div id="cardsGrid" class="grid"></div>

    <div class="table-panel">
      <div class="table-header">
        <div class="table-title">每日籌碼統計歷史總表</div>
        <div id="sampleSummary" class="metric-sub"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>台指結算</th>
              <th>現貨量(億)</th>
              <th>融資餘額(億)</th>
              <th>美元台幣</th>
              <th>外資現貨</th>
              <th>投信現貨</th>
              <th>自營商</th>
              <th>外資期未平倉</th>
              <th>五大淨額</th>
              <th>十大淨額</th>
              <th>P/C比</th>
              <th>外資選(萬)</th>
              <th>小台散戶</th>
              <th>微台散戶</th>
              <th>台積ADR</th>
              <th>趨勢判定</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr>
              <td colspan="18" class="empty-state">正在載入歷史統計資料...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const METRIC_META = [
      { key: "台指結算", tag: "01·期貨指數", fmt: "int" },
      { key: "現貨量(億)", tag: "02·大盤量能", fmt: "f1" },
      { key: "融資餘額(億)", tag: "03·散戶信用", fmt: "f2" },
      { key: "美元兌台幣", tag: "04·匯率動向", fmt: "f3" },
      { key: "外資現貨(億)", tag: "05·三大法人", fmt: "f2" },
      { key: "投信現貨(億)", tag: "06·三大法人", fmt: "f2" },
      { key: "自營商現貨(億)", tag: "07·三大法人", fmt: "f2" },
      { key: "外資台指期未平倉", tag: "08·期貨籌碼", fmt: "int" },
      { key: "五大淨額(口)", tag: "09·大額交易人", fmt: "int" },
      { key: "十大淨額(口)", tag: "10·大額交易人", fmt: "int" },
      { key: "P/C未平倉比", tag: "11·選擇權指標", fmt: "pct" },
      { key: "外資選擇權未平倉淨額(萬)", tag: "12·選擇權指標", fmt: "int" },
      { key: "小台散戶多空比(%)", tag: "13·散戶指標", fmt: "f2" },
      { key: "微台散戶多空比(%)", tag: "14·散戶指標", fmt: "f2" },
      { key: "台積電美股ADR指數", tag: "15·美股連動", fmt: "f2" },
    ];

    function toNum(v) {
      if (v === null || v === undefined || v === "" || v === "--") return null;
      const n = parseFloat(String(v).replace(/,/g, "").replace("%", "").trim());
      return Number.isFinite(n) ? n : null;
    }

    function fmtVal(entry, mode) {
      if (!entry || entry.value === null || entry.value === undefined || entry.value === "--") {
        return "--";
      }
      if (mode === "pct") {
        const s = String(entry.value);
        return s.endsWith("%") ? s : `${s}%`;
      }
      const n = toNum(entry.value);
      if (n === null) return String(entry.value);
      if (mode === "int") return Math.round(n).toString();
      if (mode === "f1") return n.toFixed(1);
      if (mode === "f2") return n.toFixed(2);
      if (mode === "f3") return n.toFixed(3);
      return String(entry.value);
    }

    // 單一指標燈號判定：1 = 紅燈(偏多), -1 = 綠燈(偏空), 0 = 灰燈(中性)
    function getSignal(key, entry) {
      if (!entry) return 0;
      const v = toNum(entry.value);
      const prev = toNum(entry.prev);
      const chg = toNum(entry.change);

      if (key === "台指結算") {
        if (v !== null && prev !== null) return v > prev ? 1 : (v < prev ? -1 : 0);
        return 0;
      }
      if (key === "融資餘額(億)") {
        if (v !== null && prev !== null) return v < prev ? 1 : (v > prev ? -1 : 0);
        return 0;
      }
      if (key === "美元兌台幣") {
        if (v !== null && prev !== null) return v < prev ? 1 : (v > prev ? -1 : 0);
        return 0;
      }
      if (["外資現貨(億)", "投信現貨(億)", "自營商現貨(億)", "外資台指期未平倉", "五大淨額(口)", "十大淨額(口)", "外資選擇權未平倉淨額(萬)"].includes(key)) {
        if (v === null || v === 0) return 0;
        return v > 0 ? 1 : -1;
      }
      if (key === "P/C未平倉比") {
        if (v === null) return 0;
        if (v >= 105) return 1;
        if (v <= 90) return -1;
        return 0;
      }
      if (["小台散戶多空比(%)", "微台散戶多空比(%)"].includes(key)) {
        // 散戶過度偏多視為反指標(綠燈)，散戶偏空視為反指標(紅燈)
        if (v === null) return 0;
        if (v <= -15) return 1;
        if (v >= 15) return -1;
        return 0;
      }
      if (key === "台積電美股ADR指數") {
        if (chg !== null) return chg > 0 ? 1 : (chg < 0 ? -1 : 0);
        return 0;
      }
      return 0;
    }

    // 統計單日紅燈數、綠燈數與紅燈比例
    function calcRedGreen(record) {
      const d = (record && record.data) || {};
      let red = 0;
      let green = 0;
      for (const m of METRIC_META) {
        const sig = getSignal(m.key, d[m.key]);
        if (sig === 1) red += 1;
        else if (sig === -1) green += 1;
      }
      const activeTotal = red + green;
      const redRatio = activeTotal > 0 ? red / activeTotal : 0.5;
      return { red, green, activeTotal, redRatio };
    }

    // 根據歷史紀錄中「相近紅/綠燈比例」統計隔日台指漲跌，推估隔日漲幅與操作
    function buildOperationStats(records) {
      // records 按日期由舊到新排序
      const sorted = [...records].sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
      const samples = [];

      for (let i = 0; i < sorted.length - 1; i++) {
        const curClose = toNum(sorted[i]?.data?.["台指結算"]?.value);
        const nextClose = toNum(sorted[i + 1]?.data?.["台指結算"]?.value);
        if (curClose && curClose > 0 && nextClose && nextClose > 0) {
          const pctChange = ((nextClose - curClose) / curClose) * 100;
          const ptsChange = nextClose - curClose;
          const rg = calcRedGreen(sorted[i]);
          samples.push({
            redRatio: rg.redRatio,
            pctChange,
            ptsChange,
          });
        }
      }

      return function evaluateOperation(record) {
        const rg = calcRedGreen(record);
        // 尋找紅燈比例相差在 ±15% 內的歷史樣本
        const matched = samples.filter((s) => Math.abs(s.redRatio - rg.redRatio) <= 0.15);

        if (matched.length > 0) {
          const avgPct = matched.reduce((acc, s) => acc + s.pctChange, 0) / matched.length;
          const avgPts = matched.reduce((acc, s) => acc + s.ptsChange, 0) / matched.length;
          const signPct = avgPct >= 0 ? "+" : "";
          const signPts = avgPts >= 0 ? "+" : "";
          let action = "觀望整理";
          let cls = "op-wait";
          if (avgPct >= 0.35) {
            action = "偏多操作";
            cls = "op-bull";
          } else if (avgPct <= -0.35) {
            action = "偏空防守";
            cls = "op-bear";
          }
          return {
            label: `${action}（估 ${signPct}${avgPct.toFixed(2)}% / ${signPts}${Math.round(avgPts)}點）`,
            cls,
            note: `樣本 ${matched.length} 筆`,
          };
        }

        // 尚無跨日樣本時，以當日紅綠燈比例給出初步參考
        const ratioPct = Math.round(rg.redRatio * 100);
        if (rg.red > rg.green + 1) {
          return {
            label: `紅燈佔 ${ratioPct}%・偏多參考`,
            cls: "op-bull",
            note: `累積 ${samples.length} 筆隔日樣本`,
          };
        }
        if (rg.green > rg.red + 1) {
          return {
            label: `紅燈佔 ${ratioPct}%・偏空參考`,
            cls: "op-bear",
            note: `累積 ${samples.length} 筆隔日樣本`,
          };
        }
        return {
          label: `紅燈佔 ${ratioPct}%・中性觀望`,
          cls: "op-wait",
          note: `累積 ${samples.length} 筆隔日樣本`,
        };
      };
    }

    function renderCards(record) {
      const grid = document.getElementById("cardsGrid");
      const d = (record && record.data) || {};
      grid.innerHTML = METRIC_META.map((m) => {
        const entry = d[m.key] || { value: "--" };
        const sig = getSignal(m.key, entry);
        const dotCls = sig === 1 ? "sig-red" : (sig === -1 ? "sig-green" : "sig-gray");
        const valCls = sig === 1 ? "val-red" : (sig === -1 ? "val-green" : "val-neutral");
        const dispVal = fmtVal(entry, m.fmt);

        let subText = "";
        const v = toNum(entry.value);
        const prev = toNum(entry.prev);
        const chg = toNum(entry.change);
        if (m.key === "台指結算" && v !== null && prev !== null) {
          const diff = Math.round(v - prev);
          subText = `較前日: ${diff >= 0 ? "+" : ""}${diff}`;
        } else if (m.key === "融資餘額(億)" && v !== null && prev !== null) {
          const diff = (v - prev).toFixed(2);
          subText = `較前日: ${diff >= 0 ? "+" : ""}${diff}`;
        } else if (m.key === "外資台指期未平倉" && v !== null && prev !== null) {
          const diff = Math.round(v - prev);
          subText = `較前日: ${diff >= 0 ? "+" : ""}${diff}`;
        } else if (m.key === "台積電美股ADR指數" && chg !== null) {
          subText = `漲跌: ${chg >= 0 ? "+" : ""}${chg.toFixed(2)}`;
        }

        return `
          <div class="card">
            <div class="card-top">
              <span class="tag">${m.tag}</span>
              <span class="signal-dot ${dotCls}"></span>
            </div>
            <div>
              <div class="metric-name">${m.key}</div>
              <div class="metric-val ${valCls}">${dispVal}</div>
              ${subText ? `<div class="metric-sub">${subText}</div>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderHistoryTable(records) {
      const tbody = document.getElementById("historyBody");
      const summaryEl = document.getElementById("sampleSummary");

      if (!records || records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="18" class="empty-state">目前尚無籌碼歷史資料</td></tr>`;
        summaryEl.textContent = "";
        return;
      }

      const evaluateOp = buildOperationStats(records);
      const descRecords = [...records].sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));

      let validPairs = 0;
      const asc = [...records].sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
      for (let i = 0; i < asc.length - 1; i++) {
        if (toNum(asc[i]?.data?.["台指結算"]?.value) && toNum(asc[i + 1]?.data?.["台指結算"]?.value)) {
          validPairs += 1;
        }
      }
      summaryEl.textContent = `已累積 ${records.length} 個交易日｜可比對隔日漲跌樣本 ${validPairs} 筆`;

      tbody.innerHTML = descRecords.map((rec) => {
        const d = rec.data || {};
        const rg = calcRedGreen(rec);
        const op = evaluateOp(rec);

        const cell = (key, mode) => `<td>${fmtVal(d[key], mode)}</td>`;
        return `
          <tr>
            <td><strong>${rec.date || "--"}</strong></td>
            ${cell("台指結算", "int")}
            ${cell("現貨量(億)", "f1")}
            ${cell("融資餘額(億)", "f2")}
            ${cell("美元兌台幣", "f3")}
            ${cell("外資現貨(億)", "f2")}
            ${cell("投信現貨(億)", "f2")}
            ${cell("自營商現貨(億)", "f2")}
            ${cell("外資台指期未平倉", "int")}
            ${cell("五大淨額(口)", "int")}
            ${cell("十大淨額(口)", "int")}
            ${cell("P/C未平倉比", "pct")}
            ${cell("外資選擇權未平倉淨額(萬)", "int")}
            ${cell("小台散戶多空比(%)", "f2")}
            ${cell("微台散戶多空比(%)", "f2")}
            ${cell("台積電美股ADR指數", "f2")}
            <td>
              <span class="trend-pill">
                <span style="color:var(--red)">紅 ${rg.red}</span>
                <span>/</span>
                <span style="color:var(--green)">綠 ${rg.green}</span>
              </span>
            </td>
            <td>
              <span class="op-badge ${op.cls}" title="${op.note}">${op.label}</span>
            </td>
          </tr>
        `;
      }).join("");
    }

    let allRecords = [];

    function applySelectedView() {
      const sel = document.getElementById("dateSelect").value;
      const sortedDesc = [...allRecords].sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
      const target = sel === "__LATEST__"
        ? sortedDesc[0]
        : (sortedDesc.find((r) => r.date === sel) || sortedDesc[0]);

      document.getElementById("updateTime").textContent = (target && target.update_time) || "無資料";
      renderCards(target);
      renderHistoryTable(allRecords);
    }

    async function loadAllData() {
      const ts = Date.now();
      let hist = [];
      let latest = null;

      try {
        const resH = await fetch(`./history.json?t=${ts}`, { cache: "no-store" });
        if (resH.ok) {
          const parsedH = await resH.json();
          if (Array.isArray(parsedH)) hist = parsedH;
        }
      } catch (_) {}

      try {
        const resD = await fetch(`./data.json?t=${ts}`, { cache: "no-store" });
        if (resD.ok) {
          const parsedD = await resD.json();
          if (parsedD && parsedD.data) {
            latest = {
              date: parsedD.date || String(parsedD.update_time || "").slice(0, 10) || "最新",
              update_time: parsedD.update_time || "",
              data: parsedD.data,
            };
          }
        }
      } catch (_) {}

      const map = new Map();
      for (const item of hist) {
        if (item && item.date) map.set(item.date, item);
      }
      if (latest && latest.date) {
        map.set(latest.date, latest);
      }

      allRecords = Array.from(map.values());

      const selectEl = document.getElementById("dateSelect");
      const prevVal = selectEl.value;
      const descDates = [...allRecords]
        .map((r) => r.date)
        .filter(Boolean)
        .sort((a, b) => b.localeCompare(a));

      selectEl.innerHTML = `<option value="__LATEST__">最新盤後數據</option>` +
        descDates.map((d) => `<option value="${d}">${d}</option>`).join("");

      if (prevVal === "__LATEST__" || descDates.includes(prevVal)) {
        selectEl.value = prevVal;
      } else {
        selectEl.value = "__LATEST__";
      }

      applySelectedView();
    }

    document.getElementById("dateSelect").addEventListener("change", applySelectedView);
    document.getElementById("refreshBtn").addEventListener("click", loadAllData);

    loadAllData();
  </script>
</body>
</html>
