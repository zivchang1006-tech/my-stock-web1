<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股每日盤後籌碼戰情室</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0e1626;
      --panel-2: #131e33;
      --border: rgba(148, 163, 184, 0.16);
      --text: #e5edf7;
      --muted: #8fa1bc;
      --red: #ff4d67;
      --red-bg: rgba(255, 77, 103, 0.14);
      --green: #16c784;
      --green-bg: rgba(22, 199, 132, 0.14);
      --gray: #64748b;
      --gray-bg: rgba(100, 116, 139, 0.16);
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: radial-gradient(circle at top, #0f1b33 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    .container {
      max-width: 1520px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      display: inline-block;
    }

    h1 {
      margin: 2px 0 0;
      font-size: 20px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    select, button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover, select:hover {
      border-color: var(--accent);
    }

    .legend {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .tag {
      font-size: 10px;
      color: var(--muted);
      background: var(--panel-2);
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .signal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sig-red { background: var(--red); box-shadow: 0 0 8px rgba(255, 77, 103, 0.5); }
    .sig-green { background: var(--green); box-shadow: 0 0 8px rgba(22, 199, 132, 0.45); }
    .sig-gray { background: var(--gray); }

    .metric-name {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .val-red { color: var(--red); }
    .val-green { color: var(--green); }
    .val-neutral { color: var(--text); }

    .metric-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .table-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .table-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .table-title {
      font-size: 14px;
      font-weight: 700;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      white-space: nowrap;
    }

    th, td {
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    th:first-child, td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: var(--panel);
      z-index: 1;
    }

    th:last-child, td:last-child {
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      background: var(--panel-2);
    }

    tr:hover td {
      background: rgba(56, 189, 248, 0.05);
    }

    .trend-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      font-weight: 600;
      font-size: 11px;
    }

    .op-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .op-bull { background: var(--red-bg); color: var(--red); }
    .op-bear { background: var(--green-bg); color: var(--green); }
    .op-wait { background: var(--gray-bg); color: #cbd5e1; }

    .empty-state {
      text-align: center;
      padding: 22px;
      color: var(--muted);
    }
  </style>
</head>
<body>

    <div class="topbar">
      <div>
        <div class="eyebrow">
          <span class="dot-live"></span>
          TWSE / TAIFEX DAILY CHIP ANALYTICS

        <h1>台股每日盤後籌碼戰情室</h1>
      </div>

      <div class="controls">
        <div class="pill-box">
          <span>歷史紀錄：</span>
          <select id="dateSelect">
            <option value="__LATEST__">最新盤後數據</option>
          </select>
        </div>
        <div class="pill-box">
          <span>更新時間：</span>
          <strong id="updateTime">讀取中...</strong>

        <button id="refreshBtn" type="button" title="重新載入">↻</button>
      </div>
    </div>

    <div class="legend">
      <div class="legend-items">
        <span><i class="badge-dot" style="background:var(--red)"></i>紅燈（偏多訊號）</span>
        <span><i class="badge-dot" style="background:var(--green)"></i>綠燈（偏空訊號）</span>
        <span><i class="badge-dot" style="background:var(--gray)"></i>灰燈（中性參考）</span>

    </div>

              <th>自營商</th>
              <th>外資期未平倉</th>
              <th>五大淨額</th>

              <th>P/C比</th>
              <th>外資選(萬)</th>
              <th>小台散戶</th>
              <th>微台散戶</th>
              <th>台積ADR</th>
              <th>趨勢判定</th>
              <th>操作</th>
            </tr>
