<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股每日盤後籌碼戰情室</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-7xl mx-auto">
    <!-- 頂部標題區 -->
    <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-6 mb-6 gap-4">
      <div>
        <div class="flex items-center gap-2 text-xs text-slate-400 tracking-widest mb-1">
          <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
          TWSE / TAIFEX DAILY CHIP ANALYTICS
        </div>
        <h1 class="text-3xl font-bold text-white">台股每日盤後籌碼戰情室</h1>
      </div>
      <div class="flex items-center gap-3 bg-slate-900 border border-slate-800 px-4 py-2.5 rounded-xl">
        <span class="text-sm text-slate-400">🕒 最後更新時間：<strong id="update-time" class="text-slate-200">讀取中...</strong></span>
        <button onclick="loadData()" class="p-1.5 hover:bg-slate-800 rounded-lg text-slate-300" title="重新整理">🔄</button>
      </div>
    </div>

    <!-- 燈號說明列 -->
    <div class="flex flex-wrap items-center justify-between bg-slate-900/70 border border-slate-800/80 px-4 py-3 rounded-xl mb-6 text-sm text-slate-300 gap-3">
      <div class="flex items-center gap-4">
        <span class="text-slate-400">戰情燈號判定：</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-500 shadow-[0_0_8px_#f43f5e]"></span>紅燈（偏多訊號）</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>綠燈（偏空訊號）</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-slate-500"></span>灰燈（中性參考）</span>
      </div>
      <div class="text-xs text-slate-500">資料來源：data.json</div>
    </div>

    <!-- 15張數據卡片區 -->
    <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"></div>
  </div>

  <script>
    const itemsConfig = [
      { id: "01 · 期貨指數", key: "台指結算", rule: "diff_less_green" },
      { id: "02 · 大盤量能", key: "現貨量(億)", rule: "vol_8000" },
      { id: "03 · 散戶信用", key: "融資餘額(億)", rule: "diff_less_red" },
      { id: "04 · 匯率動向", key: "美元兌台幣", rule: "neutral" },
      { id: "05 · 三大法人", key: "外資現貨(億)", rule: "pos_red" },
      { id: "06 · 三大法人", key: "投信現貨(億)", rule: "pos_red" },
      { id: "07 · 三大法人", key: "自營商現貨(億)", rule: "pos_red" },
      { id: "08 · 期貨籌碼", key: "外資台指期未平倉", rule: "diff_less_green" },
      { id: "09 · 大額交易人", key: "五大淨額(口)", rule: "pos_red" },
      { id: "10 · 大額交易人", key: "十大淨額(口)", rule: "pos_red" },
      { id: "11 · 選擇權指標", key: "P/C未平倉比", rule: "neutral" },
      { id: "12 · 選擇權指標", key: "外資選擇權未平倉淨額(萬)", rule: "neutral" },
      { id: "13 · 散戶指標", key: "小台散戶多空比(%)", rule: "pos_green" },
      { id: "14 · 散戶指標", key: "微台散戶多空比(%)", rule: "pos_green" },
      { id: "15 · 美股連動", key: "台積電美股ADR指數", rule: "adr_change" }
    ];

    function parseNum(v) {
      if (v === null || v === undefined) return NaN;
      return parseFloat(String(v).replace(/[,%]/g, ""));
    }

    function getLight(rule, val, prev, change) {
      const num = parseNum(val);
      if (isNaN(num)) return "gray";
      if (rule === "vol_8000") return num > 8000 ? "red" : "green";
      if (rule === "pos_red") return num > 0 ? "red" : (num < 0 ? "green" : "gray");
      if (rule === "pos_green") return num > 0 ? "green" : (num < 0 ? "red" : "gray");
      if (rule === "diff_less_green" && !isNaN(parseNum(prev))) {
        return num < parseNum(prev) ? "green" : (num > parseNum(prev) ? "red" : "gray");
      }
      if (rule === "diff_less_red" && !isNaN(parseNum(prev))) {
        return num < parseNum(prev) ? "red" : (num > parseNum(prev) ? "green" : "gray");
      }
      if (rule === "adr_change" && !isNaN(parseNum(change))) {
        return parseNum(change) > 0 ? "red" : (parseNum(change) < 0 ? "green" : "gray");
      }
      return "gray";
    }

    async function loadData() {
      const grid = document.getElementById("cards-grid");
      try {
        const res = await fetch("data.json?t=" + Date.now());
        const json = await res.json();
        document.getElementById("update-time").textContent = json.update_time || "已更新";
        const dataset = json.data || json;

        grid.innerHTML = itemsConfig.map(item => {
          const raw = dataset[item.key];
          let val = "--", prev = null, change = null, subText = "";

          if (raw !== undefined && raw !== null) {
            if (typeof raw === "object") {
              val = raw.value !== undefined ? raw.value : "--";
              prev = raw.prev !== undefined ? raw.prev : null;
              change = raw.change !== undefined ? raw.change : null;
            } else {
              val = raw;
            }
          }

          if (prev !== null && !isNaN(parseNum(val)) && !isNaN(parseNum(prev))) {
            const diff = (parseNum(val) - parseNum(prev)).toFixed(2).replace(/\.00$/, "");
            subText = `較前日: ${diff > 0 ? "+" + diff : diff}`;
          } else if (change !== null && !isNaN(parseNum(change))) {
            subText = `漲跌: ${change > 0 ? "+" + change : change}`;
          }

          const light = getLight(item.rule, val, prev, change);
          const lightClass = light === "red"
            ? "bg-rose-500 shadow-[0_0_12px_#f43f5e]"
            : light === "green"
            ? "bg-emerald-500 shadow-[0_0_12px_#10b981]"
            : "bg-slate-600";
          const textClass = light === "red"
            ? "text-rose-400"
            : light === "green"
            ? "text-emerald-400"
            : "text-white";

          return `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-700 transition">
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded-md">${item.id}</span>
                <span class="w-3.5 h-3.5 rounded-full ${lightClass}"></span>
              </div>
              <div>
                <div class="text-sm text-slate-300 mb-1">${item.key}</div>
                <div class="text-2xl font-bold tracking-tight ${textClass}">${val}</div>
                <div class="text-xs text-slate-500 mt-1 h-4">${subText}</div>
              </div>
            </div>
          `;
        }).join("");
      } catch (e) {
        document.getElementById("update-time").textContent = "讀取失敗";
      }
    }
    loadData();
  </script>
</body>
</html>
