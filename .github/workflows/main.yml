name: 下午16點30分準時更新＋每小時補齊數據

on:
  schedule:
    - cron: '30 8 * * 1-5'
    - cron: '15 * * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 極速安裝必要套件
        run: |
          pip install --only-binary=:all: requests yfinance

      - name: 執行爬蟲抓官方真實數據
        run: |
          python update.py

      - name: 自動存檔並更新網站
        run: |
          git config --global user.name 'StockBot'
          git config --global user.email 'bot@example.com'
          git add data.json
          git commit -m "自動更新最新股市數據" || exit 0
          git push

