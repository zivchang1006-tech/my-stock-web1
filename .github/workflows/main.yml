name: Daily Taiwan Stock Chip Update

on:
  schedule:
    # GitHub Actions cron 使用 UTC；09:15 UTC = 台灣時間 17:15。
    # 避開下午 5 點剛發布資料的時間，稍留緩衝。
    - cron: '15 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-chip-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch TWSE and TAIFEX data
        run: python update_stock_data.py

      - name: Commit daily JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily Taiwan stock chip data"
            git push
          fi
